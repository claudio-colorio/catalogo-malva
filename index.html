<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malva Íntima | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <style>
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">Malva Íntima</h1>
            <p class="text-gray-500 mt-2">Catálogo Exclusivo</p>
        </header>

        <div id="grilla" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400">Cargando colección...</div>
        </div>
    </div>

    <script>
        // TU URL DE GOOGLE SHEETS
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpJAxEgBgMJrIQ9i11kKAV7CMSy7ynDEeFsTg5fmXSG5Zsn9oS8ecWoIX9RAHAoPl2P5J8NzlzrOD9/pub?output=csv';

        Papa.parse(URL_CSV, {
            download: true, header: true,
            complete: function(results) {
                const grilla = document.getElementById('grilla');
                grilla.innerHTML = ''; 

                results.data.forEach(prod => {
                    if (!prod.Nombre) return;
                    
                    const listaIds = prod.Imagen ? prod.Imagen.split(',') : [];
                    const imgUrl = listaIds.length > 0 ? `https://lh3.googleusercontent.com/d/${listaIds[0].trim()}=w600` : 'https://via.placeholder.com/400';

                    grilla.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 product-card flex flex-col">
                            <img src="${imgUrl}" class="w-full h-48 object-cover rounded-xl mb-4" onerror="this.src='https://via.placeholder.com/400'">
                            <h2 class="font-bold text-sm text-gray-800 mb-1 line-clamp-1">${prod.Nombre}</h2>
                            <p class="text-xs text-gray-400 mb-3">${prod.Marca || 'Malva'}</p>
                            <div class="mt-auto">
                                <p class="text-xl font-black text-purple-700">$${prod.Precio}</p>
                                <button class="w-full mt-3 bg-gray-900 text-white py-2 rounded-xl text-xs font-bold hover:bg-purple-700 transition">Ver detalle</button>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
