<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malva | Bienestar Íntimo - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <header class="bg-white p-6 shadow-sm text-center">
        <h1 class="text-3xl font-bold text-malva-800">MALVA ÍNTIMA</h1>
        <input type="text" id="buscador" placeholder="Buscar productos..." class="mt-4 w-full md:w-1/2 p-2 border rounded-full text-center">
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="grilla" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            </div>
    </main>

    <script>
        // URL de tu Google Sheet publicado como CSV
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpJAxEgBgMJrIQ9i11kKAV7CMSy7ynDEeFsTg5fmXSG5Zsn9oS8ecWoIX9RAHAoPl2P5J8NzlzrOD9/pub?output=csv';

        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            complete: function(results) {
                const grilla = document.getElementById('grilla');
                grilla.innerHTML = '';
                
                results.data.forEach(prod => {
                    if (!prod.Nombre) return; // Salta filas vacías
                    
                    grilla.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <img src="${prod.Imagen || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover rounded-xl">
                            <h2 class="font-bold text-sm mt-3">${prod.Nombre}</h2>
                            <p class="text-purple-700 font-black mt-1">$${prod.Precio}</p>
                            <button class="w-full mt-3 bg-gray-900 text-white py-2 rounded-lg text-xs font-bold hover:bg-purple-700">Ver más</button>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
