<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Malva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-6xl mx-auto p-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 my-8">Catálogo Malva</h1>
        
        <div id="grilla" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center col-span-full">Cargando catálogo...</p>
        </div>
    </div>

    <script>
        // ESTA ES LA URL DE TU PLANILLA PUBLICADA EN FORMATO CSV
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpJAxEgBgMJrIQ9i11kKAV7CMSy7ynDEeFsTg5fmXSG5Zsn9oS8ecWoIX9RAHAoPl2P5J8NzlzrOD9/pub?output=csv';

        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            complete: function(results) {
                const grilla = document.getElementById('grilla');
                grilla.innerHTML = ''; // Limpiamos el texto de "Cargando"

                results.data.forEach(prod => {
                    if (!prod.Nombre) return;

                    // Si tenés varios IDs separados por coma, toma el primero para la miniatura
                    const listaIds = prod.Imagen ? prod.Imagen.split(',') : [];
                    const imgUrl = listaIds.length > 0 
                        ? `https://lh3.googleusercontent.com/d/${listaIds[0].trim()}=w400` 
                        : 'https://via.placeholder.com/400';

                    grilla.innerHTML += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 hover:shadow-md transition">
                            <img src="${imgUrl}" class="w-full h-56 object-cover rounded-xl mb-4" onerror="this.src='https://via.placeholder.com/400'">
                            <h2 class="text-lg font-bold text-gray-800">${prod.Nombre}</h2>
                            <p class="text-gray-500 text-sm mt-1">${prod.Descripcion || ''}</p>
                            <p class="text-xl font-black text-purple-700 mt-3">$${prod.Precio}</p>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
