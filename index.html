<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Malva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .product-card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800">Malva Íntima</h1>
            <p class="text-gray-500">Catálogo de productos</p>
        </header>

        <div id="grilla" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <p class="text-center col-span-full">Cargando productos...</p>
        </div>
    </div>

    <script>
        // URL de tu planilla publicada como CSV
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQpJAxEgBgMJrIQ9i11kKAV7CMSy7ynDEeFsTg5fmXSG5Zsn9oS8ecWoIX9RAHAoPl2P5J8NzlzrOD9/pub?output=csv';

        Papa.parse(URL_CSV, {
            download: true,
            header: true,
            complete: function(results) {
                const grilla = document.getElementById('grilla');
                grilla.innerHTML = ''; 

                results.data.forEach(prod => {
                    if (!prod.Nombre) return;

                    const listaIds = prod.Imagen ? prod.Imagen.split(',') : [];
                    const imgUrl = listaIds.length > 0 
                        ? `https://lh3.googleusercontent.com/d/${listaIds[0].trim()}=w400` 
                        : 'https://via.placeholder.com/400';

                    grilla.innerHTML += `
                        <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-200 product-card">
                            <img src="${imgUrl}" class="w-full h-40 object-cover rounded-lg mb-3" onerror="this.src='https://via.placeholder.com/400'">
                            <h2 class="text-sm font-bold text-gray-800 line-clamp-1">${prod.Nombre}</h2>
                            <p class="text-xs text-gray-500 mb-2">${prod.Marca || ''}</p>
                            <p class="text-lg font-black text-purple-600">$${prod.Precio}</p>
                            <button class="w-full mt-2 bg-purple-600 text-white py-1 rounded-lg text-xs font-bold">Ver más</button>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
